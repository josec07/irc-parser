services:
  irc-parser:
    build: .
    image: irc-parser:1.1.0
    env_file:
      - .env
    environment:
      # The process inside the container must listen on all interfaces.
      # The published port below stays on localhost unless you change it.
      IRCP_BIND: 0.0.0.0
      IRCP_PORT: 8080
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
